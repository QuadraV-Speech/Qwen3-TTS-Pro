name: Bug report
description: Report a reproducible Qwen3-TTS-Pro problem
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Do not include tokens, private audio, model caches, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Qwen3-TTS-Pro version
      placeholder: v0.1.0-preview
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: GPU, driver, CUDA, Python, vLLM and vLLM-Omni versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal commands or protocol frames that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
